<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#040705">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Hunt">
<title>Night Hunt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Saira+Stencil+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#040705;--panel:#09100b;--line:#1a291f;--grn:#3dff8b;--grn2:#1e7a47;
  --amb:#ffb020;--red:#ff4545;--txt:#b9d6c3;--mute:#5b7564;
  --mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  --head:'Rajdhani',system-ui,sans-serif;
  --sten:'Saira Stencil One','Rajdhani',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono)}
body{min-height:100dvh;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
body.dark{background:#000}
body.apoc{--amb:#ff4a3d}
.modepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.modepick button{background:transparent;border:1px solid var(--line);color:var(--mute);font-family:var(--sten);font-size:16px;letter-spacing:1px;padding:14px 4px;border-radius:0}
.modepick button.on{color:#021007;background:var(--grn);border-color:var(--grn)}
.modepick button.on.ap{background:#ff4a3d;border-color:#ff4a3d}
.modepick button.on.ts{background:#ffb020;border-color:#ffb020}
.modepick button.on.dm{background:#4aa8ff;border-color:#4aa8ff}
/* deathmatch */
body.tdm{--tm:#4aa8ff}
.btn.tbtn{margin:0;color:var(--tc);border-color:var(--tc)}
.btn.tbtn.on{background:var(--tc);color:#020406}
.clsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clsb{background:transparent;border:1px solid var(--line);color:var(--mute);font-family:var(--head);font-weight:700;letter-spacing:2px;font-size:15px;padding:10px 8px;text-align:left;display:flex;justify-content:space-between;align-items:center;border-radius:0}
.clsb b{font-weight:700}
.clsb .hrt{color:#ff5a6a;font-size:12px;letter-spacing:0}
.clsb.on{border-color:var(--grn);color:var(--grn);background:rgba(61,255,139,.08)}
.hearts{text-align:center;font-size:30px;letter-spacing:4px;color:#ff4d5e;margin:2px 0 2px;min-height:38px;text-shadow:0 0 10px rgba(255,77,94,.4)}
.hearts .hx{color:#2a1418;text-shadow:none}
.tstat{text-align:center;font-size:12px;letter-spacing:2px;min-height:18px;margin-bottom:2px}
.btn.fire{font-size:24px;padding:18px;letter-spacing:5px;background:transparent;color:var(--mute);border-color:var(--line)}
.btn.fire:disabled{opacity:.5}
.btn.fire.lit{background:#ff3b3b;border-color:#ff3b3b;color:#fff;box-shadow:0 0 18px rgba(255,59,59,.45)}
.chg{position:relative;height:14px;border:1px solid var(--line);margin-bottom:6px}
.chg i{position:absolute;top:0;bottom:0;width:1px;background:var(--mute)}
.chgbar{height:100%;width:0;background:linear-gradient(90deg,#1e7a47,#ffb020,#ff3b3b)}
.susbar{border:1px solid #6a4a10;color:var(--amb);font-size:12px;line-height:1.5;padding:8px 10px;margin-bottom:10px}
.susbar .btn{margin:8px 0 0}
.fe{font-size:13px;letter-spacing:1px;padding:5px 0;border-top:1px solid var(--line)}
.fe:first-child{border-top:0}
.fe.dim,.dim{color:var(--mute)}
.btn.revb{color:var(--amb);border-color:#6a4a10;margin-bottom:8px}
.kd{display:grid;grid-template-columns:1fr 34px 34px 44px 40px;gap:4px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;text-align:right}
.kd span:first-child{text-align:left;color:var(--txt)}
.kd i{font-style:normal;font-size:10px;color:var(--mute);letter-spacing:1px}
.kd.hd{font-size:10px;letter-spacing:2px;color:var(--mute);border-top:0}
.kd.me span:first-child{color:var(--grn)}
.basenav{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 16px;color:var(--tm);letter-spacing:2px}
body.tdm .capd .big{color:var(--tm)}
.diag .ct{font-size:12px}.diag .sub2{font-size:11px;color:var(--mute);letter-spacing:1px;margin:10px 0 2px}
.modename{font-family:var(--sten);font-size:22px;color:var(--grn);letter-spacing:1px;margin:0 0 14px}
body.apoc .modename{color:#ff4a3d}
body.dark::after{display:none}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px)}
b{font-weight:400}
.amb{color:var(--amb)}.grn{color:var(--grn)}.redt{color:var(--red)}

.brand{text-align:center;margin:22px 0 24px}
.logo{font-family:var(--sten);font-size:58px;line-height:.92;color:var(--grn);letter-spacing:2px;text-shadow:0 0 18px rgba(61,255,139,.35)}
.logo span{display:block;color:var(--amb);text-shadow:0 0 18px rgba(255,176,32,.3)}
.tag{margin-top:10px;font-size:12px;letter-spacing:5px;color:var(--mute)}

.panel{position:relative;border:1px solid var(--line);background:var(--panel);padding:14px;margin-bottom:14px}
.panel::before{content:"";position:absolute;inset:-1px;pointer-events:none;
  background:
   linear-gradient(var(--grn2),var(--grn2)) top left/12px 2px no-repeat,
   linear-gradient(var(--grn2),var(--grn2)) top left/2px 12px no-repeat,
   linear-gradient(var(--grn2),var(--grn2)) top right/12px 2px no-repeat,
   linear-gradient(var(--grn2),var(--grn2)) top right/2px 12px no-repeat,
   linear-gradient(var(--grn2),var(--grn2)) bottom left/12px 2px no-repeat,
   linear-gradient(var(--grn2),var(--grn2)) bottom left/2px 12px no-repeat,
   linear-gradient(var(--grn2),var(--grn2)) bottom right/12px 2px no-repeat,
   linear-gradient(var(--grn2),var(--grn2)) bottom right/2px 12px no-repeat}
.lbl{font-size:11px;letter-spacing:3px;color:var(--mute);margin-bottom:8px;text-transform:uppercase}
.note{font-size:12px;color:var(--mute);line-height:1.5;margin-top:10px}
.brief p{margin:0 0 8px;font-size:13px;line-height:1.55}
.brief b{color:var(--grn)} .brief b.amb{color:var(--amb)}

input.f{width:100%;min-width:0;background:#020403;border:1px solid var(--line);color:var(--grn);font-family:var(--mono);
  font-size:22px;padding:12px;letter-spacing:3px;text-transform:uppercase;outline:none;border-radius:0}
input.f:focus{border-color:var(--grn2)}
input.f::placeholder{color:#24382b}
.row{display:flex;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{display:block;width:100%;font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:3px;text-transform:uppercase;
  padding:14px 14px;background:transparent;color:var(--grn);border:1px solid var(--grn2);border-radius:0;cursor:pointer;margin:0 0 14px}
.row .btn,.row2 .btn{margin:0}
.btn:active{background:rgba(61,255,139,.12)}
.btn.solid{background:var(--grn);color:#021007;border-color:var(--grn)}
.btn.solid:active{background:#2bd472}
.btn.redb{color:var(--red);border-color:#5e1a1a}
.btn.sm{font-size:13px;padding:10px;letter-spacing:2px}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn.ok{color:#021007;background:var(--grn2);border-color:var(--grn2)}
.btn:disabled{opacity:.35}
.hold{position:relative;overflow:hidden;isolation:isolate}
.hold::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);background:currentColor;opacity:.22;z-index:-1}
.err{color:var(--red);font-size:13px;letter-spacing:1px;margin:-4px 0 14px;line-height:1.5}
.wait{text-align:center;color:var(--amb);letter-spacing:3px;font-size:14px;padding:16px 0 18px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.4}}

.op-head{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 4px}
.op-head .btn{width:auto;margin:0}
.code{font-family:var(--sten);font-size:46px;letter-spacing:6px;color:var(--amb);line-height:1}
.sub{font-size:12px;letter-spacing:2px;color:var(--mute);margin-bottom:14px}
.roster{list-style:none;margin:0;padding:0}
.roster li{display:flex;justify-content:space-between;align-items:center;padding:11px 8px;border-top:1px solid var(--line);font-size:17px;letter-spacing:2px;color:var(--grn)}
.roster li:first-child{border-top:0}
.roster li.sel{background:rgba(255,176,32,.08);box-shadow:inset 3px 0 0 var(--amb)}
.tags i{font-style:normal;font-size:10px;letter-spacing:2px;border:1px solid var(--line);color:var(--mute);padding:2px 5px;margin-left:6px}
.tags i.amb{color:var(--amb);border-color:#6a4a10}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;letter-spacing:1px}
.setrow:first-of-type{border-top:0}
.setrow select{background:#020403;color:var(--grn);border:1px solid var(--line);font-family:var(--mono);font-size:15px;padding:7px 10px;border-radius:0;-webkit-appearance:none;appearance:none}
.setrow .v{color:var(--grn)}

/* guard */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;margin:4px 0 6px}
.hud .lbl{margin-bottom:4px}
.hv{font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:2px;color:var(--grn);line-height:1}
.rt{text-align:right}.ctr{text-align:center}
.clock{font-size:42px;color:var(--grn);line-height:1;text-shadow:0 0 12px rgba(61,255,139,.35)}
.scope-wrap{position:relative;display:flex;justify-content:center;margin:6px 0 10px}
#scope{display:block}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:var(--amb);letter-spacing:3px;font-size:13px;gap:8px;background:radial-gradient(circle,rgba(2,6,4,.85) 0 60%,rgba(2,6,4,0) 72%)}
.overlay.on{display:flex}
.overlay .big{font-size:52px;letter-spacing:2px}
.ctl{display:flex;gap:8px;margin-bottom:10px}
.seg{display:flex;flex:1;border:1px solid var(--line)}
.seg button,.seg1{flex:1;background:transparent;border:0;color:var(--mute);font-family:var(--mono);font-size:13px;padding:11px 0;letter-spacing:1px;border-radius:0}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on,.seg1.on{color:#021007;background:var(--grn)}
.seg1{flex:0 0 86px;border:1px solid var(--line)}
.capture{font-size:26px;padding:18px;letter-spacing:8px;margin-bottom:6px}
.cap-note{font-size:12px;color:var(--mute);text-align:center;letter-spacing:1px;line-height:1.5;margin:0 0 14px}
.ct{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;letter-spacing:1px}
.ct:first-child{border-top:0}
.ct.live{color:var(--grn)}.ct.sq{color:#5abeff}.ct.lost{color:var(--amb)}.ct.dim{color:var(--mute)}
.ct.strike span:first-child{text-decoration:line-through}
.gps-line{font-size:11px;color:var(--mute);letter-spacing:2px;text-align:center;margin-bottom:14px}

/* prisoner — dim red night mode */
.pris{color:#7a2222;padding-top:8px}
.p-id{font-size:12px;letter-spacing:4px}
.p-id b{display:block;font-family:var(--sten);font-size:36px;letter-spacing:2px;color:#932828;margin-top:4px}
.p-phase{margin-top:28px;font-family:var(--head);font-weight:700;letter-spacing:4px;font-size:18px}
.p-clock{font-size:80px;line-height:1;color:#a12a2a;margin:6px 0 18px}
.p-row{display:flex;justify-content:space-between;border-top:1px solid #1d0808;padding:11px 0;font-size:14px;letter-spacing:2px}
.p-warn{min-height:20px;color:#a25a18;font-size:13px;margin:10px 0 18px;line-height:1.5}
.pris .btn,.capd .btn{color:#a12a2a;border-color:#3a1010}
.pris .btn.freeb{color:#d9822b;border-color:#5a3410;font-size:20px;padding:18px 14px}
.pris .btn:disabled{opacity:.6}
.p-tips{color:#4a1414;font-size:12px;line-height:1.7;padding-left:16px;margin:22px 0}
.lock{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:44px}
.lock.on{display:flex}
.l-clock{color:#3a1010;font-size:46px;letter-spacing:2px}
.l-hold{width:104px;height:104px;border-radius:50%;padding:3px;background:conic-gradient(#5a1616 calc(var(--p,0) * 360deg),#1a0606 0)}
.l-hold span{display:flex;width:100%;height:100%;border-radius:50%;background:#000;align-items:center;justify-content:center;color:#3a1010;font-size:12px;letter-spacing:3px}

.capd{text-align:center;padding-top:40px}
.capd .big{font-family:var(--sten);font-size:54px;color:var(--red);margin:6px 0 12px}
.capd p{font-size:14px;line-height:1.6;color:var(--mute);margin:0 0 26px}

.res{text-align:center;margin:26px 0 20px}
.res-big{font-family:var(--sten);font-size:48px;line-height:1;margin:6px 0 10px}
.res.g .res-big{color:var(--amb)}.res.p .res-big{color:var(--grn)}
.res-sub{letter-spacing:2px;font-size:14px}

.setup ol{padding-left:18px;font-size:13px;line-height:1.7;margin:0}
.setup code{color:var(--amb)}

.install{border:1px dashed var(--grn2);padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.55}
.install b{color:var(--grn)}
.install .btn{margin:10px 0 0}
.gpshelp{position:fixed;left:0;right:0;bottom:0;z-index:65;display:none;background:#140606;border-top:2px solid var(--red);
  padding:16px 18px calc(env(safe-area-inset-bottom) + 16px);color:#f3c9c9;font-size:13px;line-height:1.55;max-height:80vh;overflow:auto}
.gpshelp.on{display:block}
.gpshelp h3{margin:0 0 6px;font-family:var(--head);font-size:20px;letter-spacing:3px;color:var(--red)}
.gpshelp ol{margin:6px 0 12px;padding-left:18px}
.gpshelp .btn{margin:6px 0 0}
.btn.bad{color:var(--red);border-color:#5e1a1a}
.tags i.g{color:var(--grn);border-color:var(--grn2)} .tags i.r{color:var(--red);border-color:#5e1a1a}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
  transition:.2s;background:#06110a;border:1px solid var(--grn2);color:var(--grn);padding:11px 16px;font-size:14px;letter-spacing:2px;z-index:70;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.red{color:var(--red);border-color:#5e1a1a}
#toast.amb{color:var(--amb);border-color:#6a4a10}
body.dark #toast{background:#000;color:#8a2626;border-color:#2a0c0c}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="gpsHelp" class="gpshelp"></div>
<script>
'use strict';
/* =========================================================
   CONFIG — paste your Supabase project URL and anon key
   ========================================================= */
const SUPABASE_URL = 'https://sjwarllnehssyphoormc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_eGv0iwOKZ1DP6JixaXZnrQ_vI6nax4S';

const CONFIGURED = !/^YOUR_/.test(SUPABASE_URL) && !/^YOUR_/.test(SUPABASE_ANON_KEY);
const $app = document.getElementById('app');
const $toast = document.getElementById('toast');

/* ---------- utils ---------- */
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const pad3 = n => String(Math.round(n)%360).padStart(3,'0');
const fmt = ms => { const s = Math.ceil(Math.max(0,ms)/1000); return pad(Math.floor(s/60))+':'+pad(s%60); };
const fmtUp = ms => { const s = Math.floor(Math.max(0,ms)/1000); return pad(Math.floor(s/60))+':'+pad(s%60); };
const fmtDist = m => m >= 1000 ? (m/1000).toFixed(1)+'KM' : Math.round(m)+'M';
/* ---------- buzz + sound ----------
   Android buzzes; iPhones can't, so every cue also plays a short sound (Web Audio).
   Sound starts after the first screen tap (browser rule) and can be turned off in the lobby. */
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
let actx = null, soundOn = (() => { try{ return localStorage.getItem('jb_sound') !== '0'; }catch(e){ return true; } })();
function audioUnlock(){
  try{
    // iOS: play even with the ring/silent switch on (Safari 16.4+)
    if(navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; actx = new AC(); }
    if(actx.state === 'suspended') actx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown', audioUnlock, true);
function tone(freq, at, dur, type = 'square', vol = 0.18, slideTo){
  if(!actx || actx.state !== 'running') return;
  const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
// pattern beeps for generic buzzes: each "on" segment becomes a beep
function beep(p, freq = 620){
  const arr = Array.isArray(p) ? p : [p]; let t = 0;
  arr.forEach((ms, i) => { if(i % 2 === 0) tone(freq, t, Math.max(0.04, ms / 1000), 'square', 0.12); t += ms / 1000; });
}
const SOUNDS = {
  tick:     () => tone(1800, 0, 0.03, 'sine', 0.08),
  inrange:  () => tone(1400, 0, 0.06, 'sine', 0.16),
  contact:  () => { tone(1000, 0, 0.06, 'sine'); tone(1300, 0.08, 0.06, 'sine'); },
  shot:     () => tone(260, 0, 0.09, 'sawtooth', 0.16, 70),
  rifle:    () => { tone(180, 0, 0.25, 'sawtooth', 0.22, 40); tone(1200, 0, 0.05, 'square', 0.08); },
  hitmark:  () => { tone(1500, 0, 0.05, 'square', 0.12); tone(2000, 0.06, 0.06, 'square', 0.12); },
  hit:      () => { tone(150, 0, 0.12, 'square', 0.25, 90); tone(150, 0.16, 0.12, 'square', 0.25, 90); },
  down:     () => tone(500, 0, 0.8, 'sawtooth', 0.2, 60),
  sniper:   () => tone(500, 0, 0.8, 'sine', 0.18, 1500),
  turret:   () => [0, 0.2, 0.4].forEach(t => tone(950, t, 0.12, 'square', 0.18)),
  heart:    () => { tone(70, 0, 0.12, 'sine', 0.35); tone(60, 0.18, 0.14, 'sine', 0.3); },
  revive:   () => [523, 659, 784].forEach((f, i) => tone(f, i * 0.1, 0.14, 'triangle', 0.2)),
  go:       () => [440, 554, 659, 880].forEach((f, i) => tone(f, i * 0.12, 0.16, 'square', 0.15)),
  alert:    () => { tone(880, 0, 0.1); tone(880, 0.16, 0.1); },
  bad:      () => { tone(300, 0, 0.18, 'square', 0.18); tone(220, 0.2, 0.3, 'square', 0.18); },
  free:     () => [392, 523, 659, 784].forEach((f, i) => tone(f, i * 0.09, 0.12, 'triangle', 0.2)),
  end:      () => [784, 659, 523].forEach((f, i) => tone(f, i * 0.18, 0.25, 'triangle', 0.2))
};
const vib = p => { buzz(p); if(soundOn) beep(p); };

const $ = id => document.getElementById(id);

function distM(a,b){
  const R=6371000, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
  const r=Math.PI/180, y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r);
  const x=Math.cos(a.lat*r)*Math.sin(b.lat*r) - Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);
  return (Math.atan2(y,x)/r + 360) % 360;
}
let toastT;
function toast(msg, kind=''){

  clearTimeout(toastT); toastT = setTimeout(() => { $toast.className = ''; }, 2800);
}
function errMsg(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if(/schema must be one of/i.test(m)) return 'DATABASE NOT EXPOSED: add "jailbreak" to Exposed schemas in Supabase API settings';
  if(/anonymous/i.test(m)) return 'TURN ON ANONYMOUS SIGN-INS in Supabase Authentication settings';
  if(/failed to fetch|network/i.test(m)) return 'NO CONNECTION';
  return m.toUpperCase();
}

const S = {

};
const now = () => Date.now() + S.offset;
const TXT = {
  jailbreak:{ name:'JAIL BREAK', hunter:'GUARD', hunters:'GUARDS', prey:'ESCAPED PRISONER', preys:'PRISONERS',
    alive:'AT LARGE', tagged:"HOLD · I'VE BEEN TAGGED", tagTip:"If a guard tags you, hold the button above. That's the only way you're captured.",

  scatter:'—', confirm:'', note:'Test range: every phone transmits and tracks every other phone. No winner. Walk around and compare.' };
const T = () => TXT[(S.game && TXT[S.game.game_mode]) ? S.game.game_mode : 'jailbreak'];
const rescueOn = () => !!(S.game && S.game.game_mode === 'jailbreak' && S.game.rescue_on);

// who shows up as a tracked contact on my radar
const isTarget = p => isTest() ? (p.role === 'guard' && p.user_id !== S.user.id) : p.role === 'prisoner';

function phase(){
  const g = S.game; if(!g || g.status !== 'active' || !g.hunt_at) return null;
  const n = now(), hunt = Date.parse(g.hunt_at), end = Date.parse(g.ends_at);
  if(n < hunt) return { p:'head', left:hunt-n };
  if(n < end) return { p:'hunt', left:end-n };
  return { p:'over', left:0 };
}

/* ---------- sensors ---------- */
function startGPS(cb){
  stopGPS();
  if(!('geolocation' in navigator)){ toast('NO GPS ON THIS DEVICE','red'); return; }
  S.gps.watch = navigator.geolocation.watchPosition(p => {
    const c = p.coords;
    const fix = { lat:c.latitude, lng:c.longitude, acc:c.accuracy || 0, t:Date.now() };
    S.gps.ok = true; S.gps.fix = fix;
    (S.gps.times = S.gps.times || []).push(fix.t);
    while(S.gps.times.length && S.gps.times[0] < fix.t - 60000) S.gps.times.shift();
    cb && cb(fix);
    if(S.gps.denied){ S.gps.denied = false; showGpsHelp(false); }
  }, err => {
    if(err.code === 1){ S.gps.denied = true; showGpsHelp(true); }
  }, { enableHighAccuracy:true, maximumAge:0, timeout:20000 });
}
function stopGPS(){
  if(S.gps.watch != null){ navigator.geolocation.clearWatch(S.gps.watch); S.gps.watch = null; }
}
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
  else if(e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;
  if(h == null) return;
  const so = (screen.orientation && screen.orientation.angle) || 0;
  h = (h + so) % 360;
  if(S.heading == null) S.heading = h;
  else { const d = ((h - S.heading + 540) % 360) - 180; S.heading = (S.heading + d*0.2 + 360) % 360; }
}
async function ensureCompass(){
  try{
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      const r = await DeviceOrientationEvent.requestPermission();
      if(r !== 'granted'){ toast('COMPASS DENIED','amb'); return false; }
    }
  }catch(e){ toast('COMPASS UNAVAILABLE','amb'); return false; }
  if(!S.compassOn){
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
    S.compassOn = true;
  }
  return true;
}
let wakeLock = null, wantWake = false;
async function keepAwake(on){
  wantWake = on;
  if(on){
    try{
      if('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    }catch(e){}
  } else {
    try{ wakeLock && wakeLock.release(); }catch(e){}
    wakeLock = null;
  }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    if(wantWake) keepAwake(true);
    if(S.gameId){ syncClock(); refresh(); }
  }
});
async function syncClock(){
  try{
    const t0 = Date.now(); const { data, error } = await sb.rpc('server_now'); const t1 = Date.now();
    if(!error && data) S.offset = Date.parse(data) - (t0 + t1)/2;
  }catch(e){}
}

/* ---------- boot ---------- */
async function init(){
  if(!CONFIGURED){ renderSetup(); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    db:{ schema:'jailbreak' }, auth:{ persistSession:true, autoRefreshToken:true }
  });
  const urlCode = (new URLSearchParams(location.search).get('g') || '').toUpperCase();
  try{
    let { data:{ session } } = await sb.auth.getSession();
    if(!session){
      const r = await sb.auth.signInAnonymously();
      if(r.error) throw r.error;
      session = r.data.session;
    }
    S.user = session.user;
  }catch(e){ renderHome(errMsg(e), urlCode); return; }
  syncClock();
  const savedId = LS.get('jb_game'), savedCode = LS.get('jb_code');
  if(savedId && (!urlCode || urlCode === savedCode)){ enterGame(savedId, savedCode); return; }
  renderHome('', urlCode);
}

function enterGame(id, code){
  S.gameId = id; LS.set('jb_game', id);
  if(code){ LS.set('jb_code', code); history.replaceState(null, '', '?g=' + code); }
  clearInterval(S.pollT); S.pollT = setInterval(refresh, 2000);
  if(!S.tickT) S.tickT = setInterval(tick, 250);
  $app.innerHTML = '<div class="wait" style="margin-top:40vh">ESTABLISHING UPLINK…</div>';
  refresh();
}
function leaveLocal(msg){
  clearInterval(S.pollT); S.pollT = null;
  teardown();
  Object.assign(S, { gameId:null, game:null, players:[], me:null, mode:null, modeKey:null, round:null, pickGuards:[] });
  LS.del('jb_game'); LS.del('jb_code');
  history.replaceState(null, '', location.pathname);
  renderHome(msg || '');
}

async function refresh(){
  if(!S.gameId || S.refreshing) return;
  S.refreshing = true;
  try{
    const [g, p] = await Promise.all([
      sb.from('games').select('*').eq('id', S.gameId).maybeSingle(),
      sb.from('players').select('*').eq('game_id', S.gameId).order('joined_at')
    ]);
    if(g.error) throw g.error;
    if(p.error) throw p.error;
    if(!g.data){ leaveLocal('THAT OP NO LONGER EXISTS'); return; }
    S.game = g.data; S.players = p.data || [];
    S.me = S.players.find(x => x.user_id === S.user.id) || null;
    if(!S.me){ leaveLocal('YOU ARE NOT ON THAT OP'); return; }
    LS.set('jb_code', S.game.code);
    route();
  }catch(e){
    if(S.mode === 'guard' || S.mode === 'prisoner') {/* keep playing; next poll retries */}
  }finally{ S.refreshing = false; }
}

function route(){
  const g = S.game, me = S.me;
  if(g.round !== S.round){
    S.round = g.round; S.endCalledAt = 0; S.trail = new Map(); S.lastPosId = 0; S.seen = new Set();
    tdmResetRound();
    S.contacts = []; S.caughtSeen = new Set(); S.caughtInit = false; S.nearby = []; S.nearbyKey = ''; S.nearbyAt = 0; S.statusSeen = new Map(); S.tx = { last:null, lastT:0, sending:false, ok:null, err:'' }; S.prevPhase = null;
  }
  let kind;
  if(g.status === 'lobby') kind = 'lobby';
  else if(g.status === 'ended') kind = 'results';
  else if(g.game_mode === 'tdm') kind = me.life === 'downed' ? 'downed' : me.life === 'dead' ? 'dead' : 'soldier';
  else if(me.role === 'guard') kind = 'guard';
  else if(me.role === 'prisoner' && me.status === 'active') kind = 'prisoner';
  else kind = 'captured';
  document.body.classList.toggle('apoc', g.game_mode === 'apocalypse');
  const key = kind + ':' + g.round;
  if(key !== S.modeKey){
    const prev = S.mode;
    teardown();
    S.mode = kind; S.modeKey = key;
    if(prev === 'prisoner' && kind === 'captured') cue('bad', [300,100,300]);
    const turned = prev === 'prisoner' && kind === 'guard';
    if(kind === 'results') cue('end', [120,80,120,80,400]);
    RENDER[kind]();
    if(turned){ cue('down', [500,150,500]); toast("YOU'VE BEEN INFECTED — HUNT THE LIVING",'red'); }
    if(prev === 'downed' && kind === 'soldier'){ cue('revive', [100,60,300]); toast('PATCHED UP — 1 ♥, KEEP HEALING'); }
    if(prev === 'captured' && kind === 'prisoner'){ cue('free', [150,80,150,80,600]); toast("YOU'RE FREE — 10 SECONDS TO RUN"); }
  } else if(UPDATE[kind]) UPDATE[kind]();
}

function teardown(){
  stopGPS();
  if(S.raf) cancelAnimationFrame(S.raf);
  S.raf = null; S.scope = null;
  keepAwake(false);
  document.body.classList.remove('dark', 'tdm');
  S.locked = false; S.scoping = false; S.scopePos = null;
}

function tick(){
  if(!S.game) return;
  const ph = phase();
  if(S.game.status === 'active' && ph && ph.p === 'over' && Date.now() - S.endCalledAt > 4000){
    S.endCalledAt = Date.now();
    sb.rpc('check_end', { p_game:S.game.id }).then(() => refresh());
  }
  if(ph && S.prevPhase === 'head' && ph.p === 'hunt'){
    cue('go', [200,120,200,120,400]);
    if(S.mode === 'guard') toast('HUNT IS LIVE');
    if(S.mode === 'soldier') toast('WEAPONS FREE');
  }
  S.prevPhase = ph ? ph.p : null;
  if(S.mode === 'prisoner' || S.mode === 'guard' || (S.mode === 'captured' && rescueOn() && S.me && S.me.role === 'prisoner')) maybeSend();
  if(S.mode === 'prisoner') pollNearby();
  if(S.mode === 'soldier' || S.mode === 'downed' || S.mode === 'dead'){
    maybeSend(); pollView(); pollEvents();
    if(S.mode === 'soldier' && S.view && S.view.me.cls === 'medic') medicTick();
  }
  if(S.mode === 'guard') pollPositions();
  if(TICK[S.mode]) TICK[S.mode](ph);
}

function armGPS(quiet){

  if(S.gps.arming) return;
  S.gps.arming = true; S.gps.lobbyMsg = 'ACQUIRING…'; if(S.mode === 'lobby') UPDATE.lobby();
  navigator.geolocation.getCurrentPosition(p => {
    S.gps.arming = false; S.gps.ok = true; S.gps.denied = false; showGpsHelp(false);
    S.gps.acc = p.coords.accuracy; S.gps.lobbyMsg = '';
    if(!quiet) toast(`GPS LOCKED ±${Math.round(p.coords.accuracy)} M`);
    reportGps(true);
    if(S.mode === 'lobby') UPDATE.lobby();
  }, err => {

    if(err.code === 1){ S.gps.denied = true; S.gps.lobbyMsg = 'BLOCKED'; showGpsHelp(true); reportGps(false); }
    else { S.gps.lobbyMsg = 'NO FIX — TAP TO RETRY'; if(!quiet) toast('NO GPS FIX YET — STEP OUTSIDE AND RETRY','amb'); }

async function maybeSend(){
  const g = S.game, f = S.gps.fix, t = S.tx;
  if(!g || g.status !== 'active' || !f || t.sending) return;
  const ph = phase(); if(!ph || ph.p === 'over') return;
  const since = Date.now() - t.lastT;
  const fast = isTdm();
  if(since < (fast ? 2000 : 2500)) return;
  const moved = t.last ? distM(t.last, f) : Infinity;
  if(!(moved >= (fast ? 1 : 3) || since >= (fast ? 5000 : 10000))) return;
  t.sending = true;

    game_id:g.id, round:g.round, user_id:S.user.id, lat:f.lat, lng:f.lng, acc:Math.round(f.acc)
  });
  t.sending = false;
  if(error){ t.ok = false; t.err = errMsg(error); t.lastT = Date.now() - 7000; }
  else { t.ok = true; t.err = ''; t.last = { lat:f.lat, lng:f.lng }; t.lastT = Date.now(); t.count = (t.count || 0) + 1; }

async function pollPositions(){
  const g = S.game; if(!g || g.status !== 'active') return;
  const ph = phase(); if(!ph || ph.p === 'head') return;
  if(S.posPolling || Date.now() - S.lastPosPoll < 2500) return;
  S.posPolling = true; S.lastPosPoll = Date.now();
  try{
    const { data, error } = await sb.from('positions')
      .select('id,user_id,lat,lng,acc,created_at')
      .eq('game_id', g.id).eq('round', g.round).gt('id', S.lastPosId)
      .order('id', { ascending:true }).limit(1000);
    if(error) throw error;
    for(const r of data){
      S.lastPosId = Math.max(S.lastPosId, Number(r.id));
      let arr = S.trail.get(r.user_id); if(!arr){ arr = []; S.trail.set(r.user_id, arr); }
      arr.push({ lat:r.lat, lng:r.lng, acc:r.acc || 0, t:Date.parse(r.created_at) });
    }
    const cut = now() - 90000; // short history, used only to detect movement
    for(const arr of S.trail.values()){ while(arr.length > 1 && arr[0].t < cut) arr.shift(); }
  }catch(e){}
  finally{ S.posPolling = false; }
}
function analyze(){
  const g = S.game, n = now(), ph = phase(), out = [];
  for(const p of S.players){
    if(!isTarget(p)) continue;
    const c = { id:p.user_id, callsign:p.callsign, status:p.status, caught_at:p.caught_at };
    const arr = S.trail.get(p.user_id) || [], L = arr[arr.length - 1];
    c.last = L || null;
    if(p.status !== 'active'){ out.push(c); continue; }
    if(!L){ c.state = 'nodata'; out.push(c); continue; }
    const age = n - L.t; c.age = age;
    let moving = false;
    if(age < 20000){
      let ref = null;
      for(let i = arr.length - 2; i >= 0; i--){ if(L.t - arr[i].t >= 8000){ ref = arr[i]; break; } }
      if(ref && L.t - ref.t <= 30000){
        moving = distM(ref, L) >= Math.max(6, Math.min(L.acc || 10, 25) * 0.6);
      }
    }
    c.moving = moving;
    if(ph && ph.p === 'hunt' && age > 45000) c.state = 'lost';
    else if(g.radar_mode === 'full' ? age < 60000 : (moving && age < 15000)) c.state = 'live';
    else c.state = 'dark';
    if(S.gps.fix){ c.dist = distM(S.gps.fix, L); c.brg = bearing(S.gps.fix, L); }
    out.push(c);
  }
  S.contacts = out;
  for(const p of S.players){
    const ck = p.user_id + '|' + p.caught_at;
    if(p.caught_at && !S.caughtSeen.has(ck)){
      if(S.caughtInit) { cue('alert', [100,60,300]); toast(T().confirm + p.callsign); }
      S.caughtSeen.add(ck);
    }
    const was = S.statusSeen.get(p.user_id);
    if(S.caughtInit && was === 'caught' && p.status === 'active' && p.role === 'prisoner'){
      cue('bad', [300,100,300]); toast('BREAKOUT: ' + p.callsign + ' IS FREE', 'amb');
    }
    S.statusSeen.set(p.user_id, p.status);
  }
  S.caughtInit = true;
  for(const c of out){
    if(c.state === 'live' && !S.seen.has(c.id)){ S.seen.add(c.id); cue('contact', 60); }
    if(c.state !== 'live') S.seen.delete(c.id);
  }
}

function renderDiag(){
  const el = $('diag'); if(!el) return;
  const n = now(), f = S.gps.fix, t = S.tx;
  const row = (a, b) => `<div class="ct"><span>${a}</span><span>${b}</span></div>`;
  const mine = [
    row('MY GPS', f ? `±${Math.round(f.acc)}M · FIX ${((Date.now() - f.t)/1000).toFixed(1)}S AGO` : 'NO FIX'),
    row('FIXES / MIN', String((S.gps.times || []).length)),
    row('SENT', t.ok === false ? 'FAILING: ' + esc(t.err) : `${t.count || 0} · LAST ${t.lastT ? Math.round((Date.now() - t.lastT)/1000) + 'S AGO' : '—'}`),
    row('HEADING', S.heading != null ? pad3(S.heading) + '°' : (S.compassOn ? 'NO DATA' : 'COMPASS OFF')),
    row('CLOCK OFFSET', `${Math.round(S.offset)} MS`)
  ].join('');
  const others = S.players.filter(isTarget).map(p => {
    const arr = S.trail.get(p.user_id) || [], L = arr[arr.length - 1];
    if(!L) return row(esc(p.callsign), 'NO DATA YET');
    const perMin = arr.filter(x => x.t > n - 60000).length;
    let spd = '—';
    for(let i = arr.length - 2; i >= 0; i--){ const dt = (L.t - arr[i].t)/1000; if(dt >= 2){ spd = (distM(arr[i], L)/dt).toFixed(1) + 'M/S'; break; } }
    const d = f ? ` · ${fmtDist(distM(f, L))}` : '';
    return row(esc(p.callsign), `±${Math.round(L.acc)}M · ${Math.round((n - L.t)/1000)}S · ${perMin}/MIN · ${spd}${d}`);
  }).join('');
  el.innerHTML = mine + `<div class="sub2">OTHER PHONES · ACC · LAST PING · PINGS/MIN · SPEED · DIST</div>` + (others || row('—', 'NO OTHER OPERATORS'));
}
// other hunters on my side
function squad(){
  const n = now();
  if(isTest()) return [];
  return S.players.filter(p => p.role === 'guard' && p.user_id !== S.user.id).map(p => {
    const arr = S.trail.get(p.user_id) || [];
    // ignore points sent before they turned (apocalypse)
    const turnedAt = p.caught_at ? Date.parse(p.caught_at) : 0;
    let L = null; for(let i = arr.length - 1; i >= 0; i--){ if(arr[i].t >= turnedAt){ L = arr[i]; break; } }
    const m = { id:p.user_id, callsign:p.callsign, last:L };
    if(L){ m.age = n - L.t; if(S.gps.fix){ m.dist = distM(S.gps.fix, L); m.brg = bearing(S.gps.fix, L); } }
    return m;
  });
}
function renderContacts(){
  const el = $('contacts'); if(!el) return;
  const ph = phase(), g = S.game, hunt = Date.parse(g.hunt_at);
  const order = { live:0, lost:1, dark:2, nodata:3 };
  const list = [...S.contacts].sort((a,b) =>
    (a.status !== 'active') - (b.status !== 'active') || (order[a.state] ?? 4) - (order[b.state] ?? 4));
  const rows = list.map(c => {
    let st, cls;
    if(c.status !== 'active'){
      const res = rescueOn() && S.players.find(p => p.freeing_target === c.id && p.status === 'active' && p.freeing_started && now() - Date.parse(p.freeing_started) < 15000);
      if(res){ st = 'BREAKOUT IN PROGRESS'; cls = 'lost'; }
      else { st = 'CAPTURED ' + (c.caught_at ? fmtUp(Date.parse(c.caught_at) - hunt) : ''); cls = 'dim strike'; }
    }
    else if(ph && ph.p === 'head'){ st = T().scatter; cls = 'dim'; }
    else if(c.state === 'live'){ st = c.dist != null ? `${fmtDist(c.dist)} · ${pad3(c.brg)}°${c.moving ? ' · MOVING' : ''}` : 'LIVE'; cls = 'live'; }
    else if(c.state === 'lost'){ st = 'SIG LOST' + (c.dist != null ? ` · ${fmtDist(c.dist)} · ${pad3(c.brg)}°` : ''); cls = 'lost'; }
    else if(c.state === 'nodata'){ st = 'NO SIGNAL'; cls = 'dim'; }
    else { st = 'NO CONTACT'; cls = 'dim'; }
    const sp = S.players.find(p => p.user_id === c.id), sl = c.status === 'active' ? safeLeft(sp) : 0;
    if(sl > 0) st += ` · SAFE ${Math.ceil(sl/1000)}S`;
    return `<div class="ct ${cls}"><span>${esc(c.callsign)}</span><span>${st}</span></div>`;
  }).join('');
  el.innerHTML = rows || `<div class="ct dim"><span>NO ${T().preys} LEFT</span></div>`;
  renderDiag();
  const sq = squad(), sp = $('squadPanel'), se = $('squad');
  if(sp && se){
    sp.style.display = sq.length ? '' : 'none';
    se.innerHTML = sq.map(m => {
      let st;
      if(!m.last) st = 'NO SIGNAL';
      else if(m.age > 30000) st = `STALE ${Math.round(m.age/1000)}S` + (m.dist != null ? ` · ${fmtDist(m.dist)}` : '');
      else st = m.dist != null ? `${fmtDist(m.dist)} · ${pad3(m.brg)}°` : 'LIVE';
      return `<div class="ct ${m.last && m.age <= 30000 ? 'sq' : 'dim'}"><span>${esc(m.callsign)}</span><span>${st}</span></div>`;
    }).join('');
  }
}

/* ---------- radar scope ---------- */
function setupScope(){
  const cv = $('scope'); if(!cv) return;
  S.scope = { cv, ctx:cv.getContext('2d'), size:0 };
  sizeScope();
  S.raf = requestAnimationFrame(drawScope);
}
function sizeScope(){
  if(!S.scope) return;
  const wrap = S.scope.cv.parentElement;
  const size = Math.max(200, Math.floor(Math.min(wrap.clientWidth, window.innerHeight * 0.56)));
  const dpr = Math.min(window.devicePixelRatio || 1, 3), cv = S.scope.cv;
  cv.style.width = size + 'px'; cv.style.height = size + 'px';
  cv.width = size * dpr; cv.height = size * dpr;
  S.scope.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S.scope.size = size;
}
window.addEventListener('resize', sizeScope);

function drawScope(ts){
  if(!S.scope) return;
  S.raf = requestAnimationFrame(drawScope);
  const { ctx, size } = S.scope; if(!size) return;
  const cx = size/2, cy = size/2, R = size/2 - 6;
  const G = '61,255,139', A = '255,176,32', F = '90,190,255';
  const rotDeg = (S.headingUp && S.heading != null) ? S.heading : 0;
  const rr = rotDeg * Math.PI/180;
  const FONT = '"Share Tech Mono", monospace';
  ctx.clearRect(0, 0, size, size);

  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  bg.addColorStop(0, '#08281a'); bg.addColorStop(1, '#020805');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();

  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.clip();

  // range rings + crosshair
  ctx.strokeStyle = `rgba(${G},.16)`; ctx.lineWidth = 1;
  for(let k = 1; k <= 4; k++){ ctx.beginPath(); ctx.arc(cx, cy, R*k/4, 0, Math.PI*2); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(cx-R, cy); ctx.lineTo(cx+R, cy); ctx.moveTo(cx, cy-R); ctx.lineTo(cx, cy+R); ctx.stroke();
  ctx.fillStyle = `rgba(${G},.45)`; ctx.font = `10px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  for(let k = 1; k <= 4; k++) ctx.fillText(Math.round(S.range*k/4) + 'm', cx + 4, cy - R*k/4 - 2);

  // sweep (screen angle, clockwise from up)
  const sw = ((ts || 0) % 4000) / 4000 * Math.PI * 2;
  for(let i = 0; i < 30; i++){
    const a0 = sw - (i+1)*0.025 - Math.PI/2, a1 = sw - i*0.025 - Math.PI/2;
    ctx.fillStyle = `rgba(${G},${(0.17*(1 - i/30)).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = `rgba(${G},.8)`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(sw)*R, cy - Math.cos(sw)*R); ctx.stroke();

  const me = S.gps.fix;
  if(me && S.game){
    const scale = R / S.range, cosLat = Math.cos(me.lat*Math.PI/180);
    const P = pt => {
      const x = (pt.lng - me.lng) * cosLat * 111320, y = (pt.lat - me.lat) * 110574;
      const xr = x*Math.cos(rr) - y*Math.sin(rr), yr = x*Math.sin(rr) + y*Math.cos(rr);
      return { x:cx + xr*scale, y:cy - yr*scale, d:Math.hypot(x, y) };
    };
    const toRim = s => { const a = Math.atan2(s.x - cx, -(s.y - cy)); return { x:cx + Math.sin(a)*(R-10), y:cy - Math.cos(a)*(R-10) }; };
    const label = (txt, s, color) => {
      ctx.fillStyle = color; ctx.font = `11px ${FONT}`; ctx.textBaseline = 'middle';
      if(s.x > cx + R*0.35){ ctx.textAlign = 'right'; ctx.fillText(txt, s.x - 10, s.y); }
      else { ctx.textAlign = 'left'; ctx.fillText(txt, s.x + 10, s.y); }
    };
    // friendly hunters
    for(const m of squad()){
      if(!m.last || m.age > 90000) continue;
      let s = P(m.last), edge = false;
      if(s.d > S.range){ s = toRim(s); edge = true; }
      const fresh = m.age <= 30000, al = fresh ? 0.95 : 0.4;
      ctx.strokeStyle = `rgba(${F},${al})`; ctx.fillStyle = `rgba(${F},${al * 0.35})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.rect(s.x - 5, s.y - 5, 10, 10); ctx.fill(); ctx.stroke();
      label(m.callsign + (edge ? ' ' + fmtDist(m.dist || 0) : '') + (fresh ? '' : ' ?'), s, `rgba(${F},${al})`);
    }
    // contacts
    for(const c of S.contacts){
      if(c.status !== 'active' || !c.last) continue;
      if(c.state === 'live'){
        let s = P(c.last), edge = false;
        if(s.d > S.range){ s = toRim(s); edge = true; }
        const ang = Math.atan2(s.x - cx, -(s.y - cy));
        let diff = (sw - ang) % (Math.PI*2); if(diff < 0) diff += Math.PI*2;
        const glow = 1 - diff/(Math.PI*2), I = 0.35 + 0.65*glow*glow;
        ctx.shadowColor = `rgba(${G},1)`; ctx.shadowBlur = 14*I;
        ctx.fillStyle = `rgba(${G},${I.toFixed(3)})`;
        ctx.beginPath();
        if(edge){ ctx.moveTo(s.x, s.y - 6); ctx.lineTo(s.x + 6, s.y); ctx.lineTo(s.x, s.y + 6); ctx.lineTo(s.x - 6, s.y); ctx.closePath(); }
        else ctx.arc(s.x, s.y, 5, 0, Math.PI*2);
        ctx.fill(); ctx.shadowBlur = 0;
        label(c.callsign + (edge ? ' ' + fmtDist(c.dist || 0) : ''), s, `rgba(${G},${(0.45 + 0.5*I).toFixed(3)})`);
      } else if(c.state === 'lost'){
        let s = P(c.last); if(s.d > S.range) s = toRim(s);
        const blink = 0.5 + 0.5*Math.sin((ts || 0)/180);
        ctx.strokeStyle = `rgba(${A},${(0.5 + 0.5*blink).toFixed(3)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(s.x-5, s.y-5); ctx.lineTo(s.x+5, s.y+5); ctx.moveTo(s.x+5, s.y-5); ctx.lineTo(s.x-5, s.y+5); ctx.stroke();
        label(c.callsign + ' LOST', s, `rgba(${A},.85)`);
      }
    }
  } else {
    ctx.fillStyle = `rgba(${A},.9)`; ctx.font = `13px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ACQUIRING GPS…', cx, cy + 34);
  }
  ctx.restore();

  // rim + bearing ticks
  ctx.strokeStyle = `rgba(${G},.6)`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  ctx.lineWidth = 1;
  for(let b = 0; b < 360; b += 10){
    const a = (b - rotDeg) * Math.PI/180, L = b % 30 === 0 ? 9 : 4;
    ctx.beginPath(); ctx.moveTo(cx + Math.sin(a)*R, cy - Math.cos(a)*R);
    ctx.lineTo(cx + Math.sin(a)*(R-L), cy - Math.cos(a)*(R-L)); ctx.stroke();
  }
  ctx.font = `12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const [b, t] of [[0,'N'],[90,'E'],[180,'S'],[270,'W']]){
    const a = (b - rotDeg) * Math.PI/180;
    ctx.fillStyle = b === 0 ? `rgba(${A},.95)` : `rgba(${G},.7)`;
    ctx.fillText(t, cx + Math.sin(a)*(R-20), cy - Math.cos(a)*(R-20));
  }

  // guard marker
  ctx.save(); ctx.translate(cx, cy);
  const hr = (S.headingUp || S.heading == null) ? 0 : S.heading * Math.PI/180;
  ctx.rotate(hr);
  ctx.fillStyle = '#eafff2'; ctx.shadowColor = `rgba(${G},1)`; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(6, 6); ctx.lineTo(0, 3); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function tdmStartBlocker(){

}
async function tdmRpc(fn, args, quiet){
  const { data, error } = await sb.rpc(fn, { p_game:S.game.id, ...args });
  if(error){ if(!quiet) toast(errMsg(error), 'red'); return null; }
  return data === null || data === undefined ? true : data;
}
async function doSetBase(){
  if(!('geolocation' in navigator)){ toast('NO GPS','red'); return; }
  toast('GETTING A GPS FIX…');
  navigator.geolocation.getCurrentPosition(async p => {
    if(p.coords.accuracy > 30) toast(`WEAK GPS (±${Math.round(p.coords.accuracy)} M) — BASE MAY BE OFF`,'amb');
    if(await tdmRpc('set_base', { p_lat:p.coords.latitude, p_lng:p.coords.longitude })){ toast('BASE SET'); refresh(); }
  }, () => toast('NO GPS FIX — TRY OUTSIDE','red'), { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
}

/* ---------- polling ---------- */
function tdmResetRound(){
  S.view = null; S.viewAt = 0; S.viewBusy = false; S.lastEv = 0; S.events = []; S.evInit = false; S.evBusy = false; S.evAt = 0;
  S.medicAt = 0; S.healing = 0; S.suspect = null; S.prevHearts = null; S.prevTarget = false; S.prevWarn = false; S.beatAt = 0;
}
async function pollView(){
  const f = S.gps.fix; if(!f || S.viewBusy || Date.now() - (S.viewAt || 0) < 1500) return;
  S.viewBusy = true; S.viewAt = Date.now();
  try{
    const { data, error } = await sb.rpc('tdm_view', { p_game:S.game.id, p_lat:f.lat, p_lng:f.lng,
      p_heading: S.heading != null ? Math.round(S.heading) : null });
    if(error) return;
    const prev = S.view; S.view = data; S.viewT = Date.now();
    tdmFeedback(prev, data);
    if(S.me && data.me.life !== S.me.life) refresh();
    if(UPDATE[S.mode]) UPDATE[S.mode]();
  } finally { S.viewBusy = false; }
}
function tdmFeedback(prev, v){
  const me = v.me;
  if(prev && prev.me.life === 'alive' && me.life === 'alive' && me.hearts < prev.me.hearts){
    cue('hit', [80,60,80]); toast(me.hearts === 1 ? 'HIT — LAST HEART' : 'HIT — ' + me.hearts + ' ♥ LEFT', 'red');
  }
  const tgt = !!v.target;
  if(tgt && !S.prevTarget) cue('inrange', 30);
  S.prevTarget = tgt;
  if(v.sniper_warn && !S.prevWarn){ cue('sniper', 600); toast('SNIPER CHARGING ON YOU — MOVE', 'amb'); }
  if(me.turret != null && !S.prevTurret){ cue('turret', [300,100,300,100,300]); toast('ENEMY TURRET LOCKING ON — BACK OFF', 'red'); }
  S.prevTurret = me.turret != null;
  S.prevWarn = !!v.sniper_warn;
  if(me.life === 'alive' && me.hearts === 1 && Date.now() - (S.beatAt || 0) > 5000){ S.beatAt = Date.now(); cue('heart', [60,120,60]); }
}
async function pollEvents(){
  if(S.evBusy || Date.now() - (S.evAt || 0) < 2000) return;
  S.evBusy = true; S.evAt = Date.now();
  try{
    const { data, error } = await sb.from('events').select('*').eq('game_id', S.game.id).eq('round', S.game.round)
      .gt('id', S.lastEv || 0).order('id', { ascending:true }).limit(50);
    if(error || !data) return;
    for(const e of data){
      S.lastEv = Math.max(S.lastEv || 0, Number(e.id));
      S.events.push(e);
      if(S.evInit) toast(evText(e, true), e.kind === 'revive' ? '' : 'amb');
    }
    S.events = S.events.slice(-30);
    S.evInit = true;
    renderFeed();
  } finally { S.evBusy = false; }
}
const tn = (n, t) => `<span style="color:${tcol(t)}">${esc(n || '?')}</span>`;
function evText(e, plain){
  const a = plain ? (e.a_name || '?') : tn(e.a_name, e.a_team), b = plain ? (e.b_name || '?') : tn(e.b_name, e.b_team);
  const w = e.weapon === 'knife' ? 'BACKSTABBED' : e.weapon === 'rifle' ? 'SNIPED' : e.weapon === 'friendly fire' ? 'FRIENDLY FIRE' : 'DOWNED';
  const other = t => t === 'red' ? 'blue' : 'red';
  if(e.kind === 'down' && e.weapon === 'turret') return `${b} CAUGHT IN ${plain ? other(e.b_team).toUpperCase() : tn(other(e.b_team).toUpperCase(), other(e.b_team))} TURRET FIRE`;
  if(e.kind === 'down') return e.a_name ? `${a} ${w} ${b}` : `${b} DOWNED (${w})`;
  if(e.kind === 'died' && e.weapon === 'turret') return `${b} ELIMINATED · DARWINISM`;
  if(e.kind === 'kill') return `${b} ELIMINATED · +1 ${plain ? (e.a_team || '').toUpperCase() : tn((e.a_team || '').toUpperCase(), e.a_team)}`;
  if(e.kind === 'revive') return `${a} REVIVED ${b}`;
  if(e.kind === 'died') return `${b} ELIMINATED`;
  return '';
}
function renderFeed(){
  const el = $('feed'); if(!el) return;
  const list = S.events.slice(-6).reverse();
  el.innerHTML = list.length ? list.map(e => `<div class="fe">${evText(e)}</div>`).join('') : '<div class="fe dim">NO CONTACT YET</div>';
}
async function medicTick(){
  const f = S.gps.fix; if(!f || Date.now() - (S.medicAt || 0) < 2500) return;
  S.medicAt = Date.now();
  const r = await tdmRpc('medic_tick', { p_lat:f.lat, p_lng:f.lng }, true);
  if(r && typeof r === 'object') S.healing = r.healing || 0;
}

}
function tdmScale(){
  const me = S.view && S.view.me;
  return Math.max(20, ((me && me.radar) || 10) * 1.6); // meters at the rim
}
function contactXY(c, cx, cy, R, span, rot){
  const a = (c.b - rot) * Math.PI / 180;
  let r = c.d / span * R, edge = false;
  if(r > R - 8){ r = R - 8; edge = true; }
  return { x:cx + Math.sin(a) * r, y:cy - Math.cos(a) * r, edge };
}
function onScopeTap(e){
  if(!S.view || !S.scope) return;
  const rect = S.scope.cv.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top;
  const size = S.scope.size, cx = size/2, cy = size/2, R = size/2 - 6, span = tdmScale(), rot = S.heading != null ? S.heading : 0;
  let best = null, bd = 28;
  for(const c of S.view.contacts){
    if(c.k !== 'f' || c.l !== 'alive') continue;
    const p = contactXY(c, cx, cy, R, span, rot), d = Math.hypot(p.x - x, p.y - y);
    if(d < bd){ bd = d; best = c; }
  }
  if(best){ S.suspect = { t:best.t, n:best.n }; cue('tick', 20); toast(`SUSPECT MARKED: "${best.n}"`, 'amb'); }
}
const blinkT = ts => 0.5 + 0.5 * Math.sin((ts || 0) / 160);
function drawTdm(ts){
  if(!S.scope) return;
  S.raf = requestAnimationFrame(drawTdm);
  const { ctx, size } = S.scope; if(!size) return;
  const cx = size/2, cy = size/2, R = size/2 - 6, G = '61,255,139', A = '255,176,32';
  const v = S.view, me = v && v.me, span = tdmScale();
  const rot = S.heading != null ? S.heading : 0;
  const FONT = '"Share Tech Mono", monospace';
  ctx.clearRect(0, 0, size, size);
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  bg.addColorStop(0, '#061a10'); bg.addColorStop(1, '#010503');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.clip();
  ctx.strokeStyle = `rgba(${G},.14)`; ctx.lineWidth = 1;
  for(let k = 1; k <= 3; k++){ ctx.beginPath(); ctx.arc(cx, cy, R*k/3, 0, Math.PI*2); ctx.stroke(); }
  // kill-range ring
  if(me){
    ctx.strokeStyle = `rgba(${A},.55)`; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(cx, cy, me.range / span * R, 0, Math.PI*2); ctx.stroke();
    if(me.cls === 'sniper'){ ctx.strokeStyle = `rgba(${A},.3)`; ctx.beginPath(); ctx.arc(cx, cy, Math.min(R, 30 / span * R), 0, Math.PI*2); ctx.stroke(); }
    ctx.setLineDash([]);
    ctx.fillStyle = `rgba(${A},.6)`; ctx.font = `10px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText(me.range + 'm', cx + 3, cy - me.range / span * R - 3);
  }
  // sniper aim cone (screen-up = where the phone points)
  if(me && me.cls === 'sniper' && S.heading != null){
    ctx.fillStyle = v.aim ? 'rgba(61,255,139,.12)' : 'rgba(255,255,255,.05)';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, Math.min(R, 30 / span * R), -Math.PI/2 - 0.35, -Math.PI/2 + 0.35); ctx.closePath(); ctx.fill();
  }
  // sweep
  const sw = ((ts || 0) % 3000) / 3000 * Math.PI * 2;
  ctx.strokeStyle = `rgba(${G},.5)`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(sw)*R, cy - Math.cos(sw)*R); ctx.stroke();
  if(v && me){
    // enemy turret zone (30 m around their base)
    if(me.eb && me.eb.d - 30 < span){
      const p = contactXY({ d:me.eb.d, b:me.eb.b }, cx, cy, R, span, rot);
      const a = (me.eb.b - rot) * Math.PI / 180, rr = me.eb.d / span * R;
      const ex = cx + Math.sin(a) * rr, ey = cy - Math.cos(a) * rr, zr = 30 / span * R;
      ctx.fillStyle = `rgba(255,59,59,${me.turret != null ? 0.18 + 0.12*blinkT(ts) : 0.1})`; ctx.strokeStyle = 'rgba(255,59,59,.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ex, ey, zr, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      if(rr < R){ ctx.fillStyle = 'rgba(255,59,59,.9)'; ctx.font = `10px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('TURRET', ex, ey); }
      else { ctx.fillStyle = 'rgba(255,59,59,.9)'; ctx.font = `10px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('TURRET ' + fmtDist(me.eb.d), p.x, p.y); }
    }
    // base
    if(me.base){
      const p = contactXY(me.base, cx, cy, R, span, rot);
      ctx.strokeStyle = tcol(me.team); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x - 7, p.y + 5); ctx.lineTo(p.x, p.y - 6); ctx.lineTo(p.x + 7, p.y + 5); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = tcol(me.team); ctx.font = `10px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('BASE', p.x, p.y + 16);
    }
    const blink = 0.5 + 0.5 * Math.sin((ts || 0) / 160);
    for(const c of v.contacts){
      const p = contactXY(c, cx, cy, R, span, rot);
      ctx.textAlign = 'left'; ctx.font = `11px ${FONT}`; ctx.textBaseline = 'middle';
      const lab = (txt, col) => { ctx.fillStyle = col; if(p.x > cx + R*0.35){ ctx.textAlign = 'right'; ctx.fillText(txt, p.x - 9, p.y); } else ctx.fillText(txt, p.x + 9, p.y); };
      if(c.k === 'f'){
        const col = tcol(me.team), down = c.l === 'downed';
        ctx.strokeStyle = col; ctx.fillStyle = down ? `rgba(255,176,32,${blink})` : col + '55'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(p.x - 5, p.y - 5, 10, 10); ctx.fill(); ctx.stroke();
        const sel = S.suspect && S.suspect.t === c.t;
        if(sel){ ctx.strokeStyle = `rgba(${A},1)`; ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI*2); ctx.stroke(); }
        lab(c.n + (down ? ' DOWN' : '') + (p.edge ? ' ' + fmtDist(c.d) : ''), down ? `rgba(${A},.95)` : col);
      } else if(c.k === 'e'){
        const col = c.s ? 'rgba(160,160,160,.8)' : '#ff3b3b';
        ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(p.x, p.y - 7); ctx.lineTo(p.x + 7, p.y + 6); ctx.lineTo(p.x - 7, p.y + 6); ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        lab((CLASSES[c.c] ? CLASSES[c.c].name : 'ENEMY') + (c.rv ? ' (UNMASKED)' : '') + (c.s ? ' · SAFE' : ''), col);
      } else if(c.k === 'm'){
        ctx.fillStyle = `rgba(255,59,59,${0.5 + 0.5*blink})`;
        ctx.fillRect(p.x - 2, p.y - 7, 4, 14); ctx.fillRect(p.x - 7, p.y - 2, 14, 4);
        lab('MEDIC ' + fmtDist(c.d), 'rgba(255,59,59,.85)');
      }
    }
  } else {
    ctx.fillStyle = `rgba(${A},.9)`; ctx.font = `13px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(S.gps.fix ? 'LINKING…' : 'ACQUIRING GPS…', cx, cy + 34);
  }
  ctx.restore();
  // rim + N marker
  ctx.strokeStyle = `rgba(${G},.55)`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  const na = -rot * Math.PI / 180;
  ctx.fillStyle = `rgba(${A},.95)`; ctx.font = `12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('N', cx + Math.sin(na)*(R-14), cy - Math.cos(na)*(R-14));
  // me
  ctx.fillStyle = me ? tcol(me.team) : '#eafff2';
  ctx.beginPath(); ctx.moveTo(cx, cy - 9); ctx.lineTo(cx + 6, cy + 6); ctx.lineTo(cx, cy + 3); ctx.lineTo(cx - 6, cy + 6); ctx.closePath(); ctx.fill();
}

/* ---------- actions ---------- */
async function doFire(){
  const f = S.gps.fix; if(!f){ toast('NO GPS FIX','amb'); return; }
  cue('shot');
  let r;
  if(S.suspect){
    r = await tdmRpc('fire_at', { p_tok:S.suspect.t, p_lat:f.lat, p_lng:f.lng });
    S.suspect = null;
    if(r && r.friendly){ cue('bad', [200,80,200]); toast('THAT WAS YOUR TEAMMATE — YOU LOST A HEART','red'); }
    else if(r && r.hit){ cue('hitmark', [40,40,40]); toast(`SPY UNMASKED: HIT ${r.hit}${r.down ? ' — DOWN!' : ''}`); }
    else if(r) toast('MISS','amb');
  } else {
    r = await tdmRpc('fire_pistol', { p_lat:f.lat, p_lng:f.lng });
    if(r && r.hit){ cue('hitmark', 40); toast(`HIT ${CLASSES[r.cls] ? CLASSES[r.cls].name : ''}${r.down ? ' — DOWN!' : ''}`); }
    else if(r) toast('MISS — NO TARGET IN RANGE','amb');
  }
  S.viewAt = 0; pollView();
}
async function doScope(){
  const me = S.view && S.view.me, f = S.gps.fix; if(!f){ toast('NO GPS FIX','amb'); return; }
  if(me && (me.charge > 0 || S.scoping)){ S.scoping = false; S.scopePos = null; await tdmRpc('cancel_charge', {}, true); }
  else if(await tdmRpc('start_charge', { p_lat:f.lat, p_lng:f.lng })){ S.scoping = true; S.scopePos = { lat:f.lat, lng:f.lng }; toast('SCOPED — HOLD STILL'); }
  S.viewAt = 0; pollView();
}
async function doRifle(){
  const f = S.gps.fix; if(!f) return;
  cue('rifle');
  if(S.heading == null) toast('NO COMPASS — FIRING AT NEAREST','amb');
  const r = await tdmRpc('fire_rifle', { p_lat:f.lat, p_lng:f.lng, p_heading:S.heading != null ? S.heading : null });
  S.scoping = false; S.scopePos = null;
  if(r && r.hit){ cue('hitmark', [40,40,120]); toast(`SNIPED ${CLASSES[r.cls] ? CLASSES[r.cls].name : ''} · ${'♥'.repeat(r.dmg)}${r.down ? ' — DOWN!' : ''}`); }
  else if(r) toast('MISS — NOTHING IN YOUR SIGHTS','amb');
  S.viewAt = 0; pollView();
}
async function doRespawn(){
  const f = S.gps.fix; if(!f){ toast('NO GPS FIX','amb'); return; }
  if(await tdmRpc('respawn', { p_lat:f.lat, p_lng:f.lng })){ cue('revive', [100,60,100]); toast('BACK IN THE FIGHT — 5 S PROTECTION'); S.viewAt = 0; refresh(); }
}
async function tdmHold(what, el){
  const f = S.gps.fix;
  if(what === 'backstab'){
    if(!f){ toast('NO GPS FIX','amb'); return; }
    const r = await tdmRpc('backstab', { p_lat:f.lat, p_lng:f.lng });
    if(r && r.by){ toast(`BACKSTABBED BY ${r.by}`,'red'); refresh(); }
  } else if(what === 'giveup'){
    if(await tdmRpc('give_up', {})) refresh();
  } else if(what === 'revive'){
    if(!f) return;
    const r = await tdmRpc('complete_revive', { p_lat:f.lat, p_lng:f.lng });
    S.medKey = '';
    if(r && r.revived){ cue('revive', [100,60,300]); toast(`${r.revived} IS BACK UP`); }
    else tdmRpc('cancel_revive', {}, true);
    S.viewAt = 0; pollView();
  }
}

/* ---------- results ---------- */
function tdmResults(tail){
  const g = S.game, w = g.winner;
  const team = t => S.players.filter(p => p.team === t).sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
  const score = t => S.players.filter(p => p.team === t).reduce((s, p) => s + (p.kills || 0), 0);
  const kd = p => p.deaths ? (p.kills / p.deaths).toFixed(1) : (p.kills || 0).toFixed(1);
  const table = t => `
    <div class="panel"><div class="lbl" style="color:${TEAM[t].col}">${TEAM[t].name} · ${score(t)} KILLS</div>
      <div class="kd hd"><span>PLAYER</span><span>K</span><span>D</span><span>K/D</span><span>REV</span></div>
      ${team(t).map(p => `<div class="kd${p.user_id === S.user.id ? ' me' : ''}"><span>${esc(p.callsign)} <i>${CLASSES[p.cls || 'rifleman'].name}${p.darwins ? ` · DARWIN ×${p.darwins}` : ''}</i></span><span>${p.kills || 0}</span><span>${p.deaths || 0}</span><span>${kd(p)}</span><span>${p.t_revives || 0}</span></div>`).join('')}
    </div>`;
  $app.innerHTML = `
  <div class="res"><div class="lbl">Team Deathmatch · round ${g.round}</div>
    <div class="res-big" style="color:${w === 'tie' ? 'var(--amb)' : tcol(w)}">${w === 'tie' ? 'DRAW' : TEAM[w] ? TEAM[w].name + ' WINS' : 'OVER'}</div>
    <div class="res-sub"><span style="color:${TEAM.red.col}">${score('red')}</span> – <span style="color:${TEAM.blue.col}">${score('blue')}</span></div></div>
  ${table(w === 'blue' ? 'blue' : 'red')}${table(w === 'blue' ? 'red' : 'blue')}${tail}`;
}

/* ---------- input ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  if(act === 'create') doCreate();
  else if(act === 'join') doJoin();
  else if(act === 'share') doShare();
  else if(act === 'gmode'){ if(S.game.game_mode !== el.dataset.v) changeSetting('game_mode', el.dataset.v); }
  else if(act === 'pick'){
    const id = el.dataset.v, gc = S.game.guard_count || 1;
    if(S.pickGuards.includes(id)) S.pickGuards = S.pickGuards.filter(x => x !== id);
    else if(gc === 1) S.pickGuards = [id];
    else if(S.pickGuards.length < gc) S.pickGuards = [...S.pickGuards, id];
    else toast(`ALREADY ${gc} ${T().hunters} — TAP ONE TO REMOVE`,'amb');
    UPDATE.lobby();
  }
  else if(act === 'start') doStart();
  else if(act === 'sound'){ setSound(!soundOn); S.lobbyKey = ''; UPDATE.lobby(); }
  else if(act === 'team') tdmRpc('set_team', { p_team:el.dataset.v }).then(ok => ok && refresh());
  else if(act === 'cls') tdmRpc('set_class', { p_cls:el.dataset.v }).then(ok => {
    if(!ok) return;
    S.me.cls = el.dataset.v;
    document.querySelectorAll('.clsb').forEach(b => b.classList.toggle('on', b.dataset.v === el.dataset.v));
    refresh();
  });
  else if(act === 'setbase') doSetBase();
  else if(act === 'shuffle') tdmRpc('shuffle_teams', {}).then(ok => ok && refresh());
  else if(act === 'fire') doFire();
  else if(act === 'clearsus'){ S.suspect = null; }
  else if(act === 'scope') doScope();
  else if(act === 'rifle') doRifle();
  else if(act === 'weapon') tdmRpc('spy_weapon', { p_weapon:el.dataset.v }).then(() => { S.viewAt = 0; pollView(); });
  else if(act === 'cloak') tdmRpc('spy_cloak', {}).then(ok => { if(ok){ cue('tick', 60); toast('CLOAKED — 10 S'); } S.viewAt = 0; pollView(); });
  else if(act === 'respawn') doRespawn();
  else if(act === 'leave') doLeave();
  else if(act === 'armgps'){ if(S.gps.denied) showGpsHelp(true); else armGPS(); }
  else if(act === 'reload') location.reload();
  else if(act === 'install' && deferredInstall){ deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; if(S.mode === 'home') renderHome(); }); }
  else if(act === 'noinstall'){ LS.set('jb_hide_install', '1'); const el = e.target.closest('.install'); if(el) el.remove(); }
  else if(act === 'hidegps') showGpsHelp(false);
  else if(act === 'armcompass') ensureCompass().then(ok => { if(ok){ toast('COMPASS ARMED'); if(S.mode === 'lobby') UPDATE.lobby(); el.remove && S.mode === 'soldier' && el.remove(); } });
  else if(act === 'rematch') doRematch();
  else if(act === 'hdg') toggleHeading();
  else if(act === 'range'){
    S.range = parseInt(el.dataset.v, 10);
    document.querySelectorAll('#rangeSeg button').forEach(b => b.classList.toggle('on', b === el));
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-set]'); if(el) changeSetting(el.dataset.set, el.value);
});
document.addEventListener('input', e => {
  if(e.target.id === 'code') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'code') doJoin();
});

let hold = null;
document.addEventListener('pointerdown', e => {
  S.lastActivity = Date.now();
  const el = e.target.closest('[data-hold]'); if(!el || el.disabled) return;
  e.preventDefault();
  const ms = +el.dataset.ms || 1500, t0 = performance.now();
  hold = { el };
  if(el.dataset.hold === 'free'){
    beginFree(el.dataset.v).then(ok => { if(!ok && hold && hold.el === el){ el.style.setProperty('--p', 0); hold = null; } });
  }
  if(el.dataset.hold === 'revive'){
    const f = S.gps.fix;
    tdmRpc('begin_revive', { p_target:el.dataset.v, p_lat:f ? f.lat : 0, p_lng:f ? f.lng : 0 })
      .then(ok => { if(!ok && hold && hold.el === el){ el.style.setProperty('--p', 0); hold = null; } });
  }
  const step = () => {
    if(!hold || hold.el !== el) return;
    const p = Math.min(1, (performance.now() - t0) / ms);
    el.style.setProperty('--p', p);
    if(p >= 1){ hold = null; el.style.setProperty('--p', 0); cue('tick', 40); onHold(el.dataset.hold, el); return; }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}, { passive:false });
const cancelHold = () => {
  if(!hold) return;
  const el = hold.el; el.style.setProperty('--p', 0); hold = null;
  if(el.dataset.hold === 'free'){ cancelFree(); toast('KEEP HOLDING FOR 10 SECONDS','amb'); }
  if(el.dataset.hold === 'revive'){ tdmRpc('cancel_revive', {}, true); toast('KEEP HOLDING TO REVIVE','amb'); }
};
document.addEventListener('pointerup', cancelHold);
document.addEventListener('pointercancel', cancelHold);
document.addEventListener('contextmenu', e => { if(e.target.closest('[data-hold]')) e.preventDefault(); });

async function onHold(what, el){
  if(what === 'free'){ completeFree(); return; }
  if(what === 'backstab' || what === 'giveup' || what === 'revive'){ tdmHold(what, el); return; }
  if(what === 'unlock'){ S.lastActivity = Date.now(); setLock(false); }
  else if(what === 'surrender'){
    const { error } = await sb.rpc('surrender', { p_game:S.game.id });
    if(error) toast(errMsg(error),'red'); else refresh();
  }
  else if(what === 'abort') doRematch();
}

if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
init();
</script>
</body>
